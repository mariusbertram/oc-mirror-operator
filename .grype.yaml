# Grype vulnerability-scan exceptions.
#
# grype auto-detects this file from the current working directory - no
# --config flag needed. Both .github/actions/sbom-scan-attest steps use it
# unchanged: the blocking release-pipeline gate (release.yml, fail-build:
# true, fails on Critical) and the report-only CI scan (ci.yml, fail-build:
# false, Security-tab visibility only). An ignored finding disappears from
# both - the SARIF upload, the human-readable job-log table, and the gate.
#
# Only add an entry after triage confirms there is currently no upstream
# fix, or that the finding does not apply to how the affected package is
# actually used here. Each entry must be preceded by a comment recording:
# who triaged it, when, why it's safe to ignore for now, and when to
# re-check for a fix. Re-review every entry before cutting a release -
# don't let this list grow stale.
#
# Example:
#   # Triaged 2026-08-08 by @marius: no upstream fix yet in
#   # golang.org/x/net as of this date; re-check before the next release.
#   - vulnerability: CVE-2026-XXXXX
ignore:
  # Triaged 2026-08-08: github.com/containerd/containerd v1.7.33 is a
  # transitive dependency via pkg/mirror/helm -> helm.sh/helm/v3/pkg/repo ->
  # .../pkg/getter -> .../pkg/registry -> containerd/containerd/remotes
  # (Helm's generic OCI-artifact pull/push client for oci:// chart repos).
  # Both CVEs are in containerd's CRI (Container Runtime Interface)
  # checkpoint/restore plugin - code neither Helm's registry client nor
  # this operator's binaries ever invoke; nothing here runs as a CRI
  # runtime or performs checkpoint/restore. Confirmed via pkg.go.dev/vuln
  # that github.com/containerd/containerd (the v1 module line) has no
  # fixed version for either CVE - the fix landed only in the unrelated
  # github.com/containerd/containerd/v2 module, which nothing in this
  # dependency graph uses. Also confirmed helm.sh/helm/v3's latest release
  # (v3.21.3, vs. our v3.20.2) still pins the same containerd v1.7.33, so
  # there is no dependency-bump path either. Re-check when containerd
  # ships a v1.7.x fix or Helm migrates its registry client to
  # containerd/v2.
  - vulnerability: GO-2026-5064 # CVE-2026-53492, GHSA-33vj-92qq-66hc
  - vulnerability: GO-2026-5338 # CVE-2026-50195, GHSA-cvxm-645q-p574
