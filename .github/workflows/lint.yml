name: Lint

on:
  push:
  pull_request:

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  ui-lint:
    name: Run on UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Run ESLint
        run: npm --prefix ui run lint

      - name: Type-check
        run: npx --prefix ui tsc --noEmit -p ui/tsconfig.json
