name: Release

# Triggered when a version tag (v*) is pushed.
# Builds a multi-arch operator image, a bundle image, creates a GitHub
# Release, and opens a PR in the brtrm-dev-catalog repo to register the
# new bundle version.
#
# Required secrets:
#   CATALOG_PAT  – Personal Access Token with repo write access to
#                  mariusbertram/brtrm-dev-catalog (Contents + Pull requests)

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository }}-controller
  MANAGER_IMAGE: ghcr.io/${{ github.repository }}-manager
  WORKER_IMAGE: ghcr.io/${{ github.repository }}-worker
  PLUGIN_IMAGE: ghcr.io/${{ github.repository }}-plugin
  BUNDLE_IMAGE: ghcr.io/${{ github.repository }}-bundle
  CATALOG_REPO: mariusbertram/brtrm-dev-catalog

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  # ── 1. Tests ──────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go mod tidy
          make test

  # ── 2. Build & push component images (multi-arch) ──────────────────────────
  build-component:
    name: Build and scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write      # cosign keyless (OIDC) SBOM attestation
      security-events: write # upload Grype SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        component: [controller, manager, worker]

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: meta
        run: |
          # Strip leading 'v': v0.0.2 → 0.0.2
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless (OIDC) signing/attestation — no signing key to manage or leak.
      # Requires the job's id-token: write permission (granted above).
      - uses: sigstore/cosign-installer@v3

      - name: Build and push component image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.title=oc-mirror-operator-${{ matrix.component }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: SBOM + vulnerability scan + attestation (amd64)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          artifact-name: ${{ matrix.component }}-amd64
          sarif-category: ${{ matrix.component }}-image-amd64
          vex-files: vex/oc-mirror-operator.openvex.json

      - name: SBOM + vulnerability scan + attestation (arm64)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          platform: linux/arm64
          artifact-name: ${{ matrix.component }}-arm64
          sarif-category: ${{ matrix.component }}-image-arm64
          vex-files: vex/oc-mirror-operator.openvex.json

      # Digest handoff occurs only after both platform scans and attestations succeed.
      # Matrix job outputs are last-writer-wins; use distinct artifacts instead.
      - name: Record component manifest-list digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p component-digests
          printf '%s\n' "$DIGEST" > "component-digests/${COMPONENT}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: release-digest-${{ matrix.component }}
          path: component-digests/${{ matrix.component }}.txt
          retention-days: 7
          if-no-files-found: error

  # Preserve the downstream output contract only after every matrix leg passes.
  build-operator:
    name: Collect scanned component digests
    runs-on: ubuntu-latest
    needs: build-component
    permissions:
      contents: read
    outputs:
      controller_digest: ${{ steps.digests.outputs.controller_digest }}
      manager_digest: ${{ steps.digests.outputs.manager_digest }}
      worker_digest: ${{ steps.digests.outputs.worker_digest }}
      version: ${{ steps.digests.outputs.version }}
      tag: ${{ steps.digests.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-digest-*
          path: component-digests
          merge-multiple: true

      - name: Emit component digests and release metadata
        id: digests
        run: |
          set -euo pipefail
          for component in controller manager worker; do
            digest="$(cat "component-digests/${component}.txt")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
              || { echo "::error::Invalid digest for $component"; exit 1; }
            echo "${component}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  # Each plugin image uses the SDK, React and PatternFly versions federated by
  # the corresponding OpenShift console release.
  build-plugin:
    name: Build console plugin for OpenShift ${{ matrix.console-version }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        console-version: ['4.18', '4.19', '4.20', '4.21', '4.22']
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Build and push versioned plugin image
        id: build-plugin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.plugin
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CONSOLE_VERSION=${{ matrix.console-version }}
          tags: |
            ${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp${{ matrix.console-version }}
            ${{ env.PLUGIN_IMAGE }}:latest-ocp${{ matrix.console-version }}
          labels: |
            org.opencontainers.image.title=oc-mirror-operator-plugin-ocp-${{ matrix.console-version }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.openshift.console.version=${{ matrix.console-version }}

      - name: SBOM + vulnerability scan + attestation (amd64)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: ${{ env.PLUGIN_IMAGE }}@${{ steps.build-plugin.outputs.digest }}
          platform: linux/amd64
          artifact-name: plugin-ocp-${{ matrix.console-version }}-amd64
          sarif-category: plugin-ocp-${{ matrix.console-version }}-amd64
          vex-files: vex/oc-mirror-operator.openvex.json

      - name: SBOM + vulnerability scan + attestation (arm64)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: ${{ env.PLUGIN_IMAGE }}@${{ steps.build-plugin.outputs.digest }}
          platform: linux/arm64
          artifact-name: plugin-ocp-${{ matrix.console-version }}-arm64
          sarif-category: plugin-ocp-${{ matrix.console-version }}-arm64
          vex-files: vex/oc-mirror-operator.openvex.json

  # ── 3. Build & push bundle image (multi-arch) ────────────────────────────
  build-bundle:
    name: Build bundle image
    runs-on: ubuntu-latest
    needs: [build-operator, build-plugin]
    permissions:
      contents: read
      packages: write
      id-token: write      # cosign keyless (OIDC) SBOM attestation
      security-events: write # upload Grype SARIF to the Security tab
    outputs:
      # Tag reference (human-readable, mutable)
      bundle_image: ${{ steps.bundle-ref.outputs.ref }}
      # Manifest-list digest (immutable, used for catalog PR and disconnected envs)
      bundle_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release bundle
        env:
          VERSION: ${{ needs.build-operator.outputs.version }}
          IMG_PLUGIN_4_18: ${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp4.18
          IMG_PLUGIN_4_19: ${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp4.19
          IMG_PLUGIN_4_20: ${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp4.20
          IMG_PLUGIN_4_21: ${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp4.21
          IMG_PLUGIN_4_22: ${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp4.22
        run: |
          set -euo pipefail
          CSV="bundle/manifests/oc-mirror.clusterserviceversion.yaml"

          # USE_IMAGE_DIGESTS=true is the Makefile default: operator-sdk pulls
          # controller, manager, worker, and all release-specific plugin images
          # from their versioned tags, then records their digests in relatedImages.
          VERSION="${VERSION}" make manifests bundle

          echo "spec.relatedImages:"
          yq '.spec.relatedImages' "$CSV"

          # Read the complete output: grep -q can close the pipe early and
          # make yq fail with SIGPIPE under pipefail even when the image exists.
          related_images="$(yq '.spec.relatedImages[].image' "$CSV")"
          for component in controller manager worker; do
            [[ "$related_images" == *"oc-mirror-operator-${component}@sha256:"* ]] \
              || { echo "ERROR: $component not in spec.relatedImages"; exit 1; }
          done
          for minor in 4.18 4.19 4.20 4.21 4.22; do
            name="plugin-${minor/./-}"
            image="$(NAME="$name" yq '.spec.relatedImages[] | select(.name == strenv(NAME)) | .image' "$CSV")"
            [[ "$image" == *"oc-mirror-operator-plugin@sha256:"* ]] \
              || { echo "ERROR: $name missing or not digest-pinned in spec.relatedImages"; exit 1; }
            env_image="$(NAME="RELATED_IMAGE_PLUGIN_${minor//./_}" yq '.spec.install.spec.deployments[0].spec.template.spec.containers[0].env[] | select(.name == strenv(NAME)) | .value' "$CSV")"
            [[ "$image" == "$env_image" ]] \
              || { echo "ERROR: $name env image does not match spec.relatedImages"; exit 1; }
          done
          echo "OK: all 5 release-specific plugin images are digest-pinned and wired to the operator"

      # QEMU is required for cross-compilation of the arm64 layer during
      # multi-arch bundle builds. The bundle contains only YAML (no binaries),
      # but OCI manifests still carry an os/arch header — a multi-arch manifest
      # list ensures OPM init-containers can pull the bundle on any node arch.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless (OIDC) signing/attestation — no signing key to manage or leak.
      - uses: sigstore/cosign-installer@v3

      - name: Build and push bundle image (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bundle.Dockerfile
          # Build a manifest list covering both arches. Even though the bundle
          # contains only YAML, OPM init-containers run on the node and must
          # be able to pull the image on any supported architecture.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BUNDLE_IMAGE }}:${{ needs.build-operator.outputs.version }}
            ${{ env.BUNDLE_IMAGE }}:latest

      - name: SBOM + vulnerability scan + attestation (bundle amd64)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: ${{ env.BUNDLE_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/amd64
          artifact-name: bundle-amd64
          sarif-category: bundle-image-amd64

      - name: SBOM + vulnerability scan + attestation (bundle arm64)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: ${{ env.BUNDLE_IMAGE }}@${{ steps.build.outputs.digest }}
          platform: linux/arm64
          artifact-name: bundle-arm64
          sarif-category: bundle-image-arm64

      - name: Emit bundle image ref
        id: bundle-ref
        run: |
          echo "ref=${{ env.BUNDLE_IMAGE }}:${{ needs.build-operator.outputs.version }}" \
            >> "$GITHUB_OUTPUT"
          echo "Bundle image: ${{ env.BUNDLE_IMAGE }}:${{ needs.build-operator.outputs.version }}"
          echo "Bundle manifest-list digest: ${{ steps.build.outputs.digest }}"

  # ── 4. GitHub Release ─────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-operator, build-bundle]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog (commits since last tag)
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline "${PREV_TAG}..HEAD" -- 2>/dev/null | head -50)
          else
            LOG=$(git log --oneline HEAD | head -50)
          fi
          # Multiline output via heredoc delimiter
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "oc-mirror-operator ${{ github.ref_name }}"
          body: |
            ## oc-mirror-operator ${{ github.ref_name }}

            ### Container Images

            | Image | Tag | Digest (manifest list) |
            |-------|-----|------------------------|
            | Controller (multi-arch) | `${{ env.CONTROLLER_IMAGE }}:${{ github.ref_name }}` | `${{ needs.build-operator.outputs.controller_digest }}` |
            | Manager (multi-arch) | `${{ env.MANAGER_IMAGE }}:${{ github.ref_name }}` | `${{ needs.build-operator.outputs.manager_digest }}` |
            | Worker (multi-arch) | `${{ env.WORKER_IMAGE }}:${{ github.ref_name }}` | `${{ needs.build-operator.outputs.worker_digest }}` |
            | Plugin images | `${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp4.18` … `-ocp4.22` | See the version-specific `relatedImages` in the bundle |
            | Bundle (multi-arch)   | `${{ needs.build-bundle.outputs.bundle_image }}` | `${{ needs.build-bundle.outputs.bundle_digest }}` |

            ### Changes

            ${{ steps.changelog.outputs.log }}

            ### Installation

            See [user guide](docs/user-guide.md) for full installation instructions.

  # ── 5. PR in catalog repo ─────────────────────────────────────────────────
  catalog-pr:
    name: Open catalog PR
    runs-on: ubuntu-latest
    needs: [build-operator, build-bundle]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Create catalog PR
        env:
          GH_TOKEN: ${{ secrets.CATALOG_PAT }}
          VERSION: ${{ needs.build-operator.outputs.version }}
          BUNDLE_REF: ${{ needs.build-bundle.outputs.bundle_image }}
          BUNDLE_DIGEST: ${{ needs.build-bundle.outputs.bundle_digest }}
        run: |
          set -euo pipefail

          # Use digest-pinned reference for reproducible disconnected installs.
          # The manifest-list digest from build-push-action covers all platforms.
          BUNDLE_DIGEST_REF="${{ env.BUNDLE_IMAGE }}@${BUNDLE_DIGEST}"

          # ── Clone catalog repo ──────────────────────────────────────────
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${CATALOG_REPO}.git" /tmp/catalog
          cd /tmp/catalog

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="add-oc-mirror-v${VERSION}"
          git checkout -b "$BRANCH"

          # ── Write operator.yaml (olm.semver template) ──────────────────
          OPERATOR_DIR="catalog/oc-mirror"
          mkdir -p "${OPERATOR_DIR}/logo"

          # If an operator.yaml already exists, append the new bundle image
          # to the Stable.Bundles list. Otherwise create a fresh file.
          YAML_FILE="${OPERATOR_DIR}/operator.yaml"

          if [ -f "$YAML_FILE" ]; then
            # Append new version only if not already present (check both digest and tag)
            if grep -qF "${BUNDLE_DIGEST_REF}" "$YAML_FILE" || grep -qF "${BUNDLE_REF}" "$YAML_FILE"; then
              echo "Bundle ${BUNDLE_DIGEST_REF} already present — nothing to do."
              exit 0
            fi
            python3 - <<PYEOF
          import yaml, sys
          path = "${YAML_FILE}"
          with open(path) as f:
              data = yaml.safe_load(f)
          bundles = data.setdefault("Stable", {}).setdefault("Bundles", [])
          bundles.append({"Image": "${BUNDLE_DIGEST_REF}"})
          with open(path, "w") as f:
              yaml.dump(data, f, default_flow_style=False, sort_keys=False)
          print("Appended bundle to", path)
          PYEOF
          else
            cat > "$YAML_FILE" <<YAMLEOF
          schema: olm.semver
          GenerateMajorChannels: true
          GenerateMinorChannels: true
          Stable:
            Bundles:
              - Image: ${BUNDLE_DIGEST_REF}
          YAMLEOF
          fi

          # ── Copy logo ───────────────────────────────────────────────────
          # Source the logo from the operator repo (checked out in step 1)
          LOGO_SRC="${GITHUB_WORKSPACE}/docs/oc-mirror-operator-logo.svg"
          if [ -f "$LOGO_SRC" ]; then
            cp "$LOGO_SRC" "${OPERATOR_DIR}/logo/oc-mirror-operator-logo.svg"
          fi

          # ── Commit & push ───────────────────────────────────────────────
          git add "${OPERATOR_DIR}"
          git diff --cached --stat

          git commit -m "feat(oc-mirror): add oc-mirror-operator v${VERSION}

          Bundle image: ${BUNDLE_DIGEST_REF}
          Controller image: ${{ env.CONTROLLER_IMAGE }}:${{ github.ref_name }}@${{ needs.build-operator.outputs.controller_digest }}"

          git push origin "$BRANCH"

          # ── Open PR ─────────────────────────────────────────────────────
          gh pr create \
            --repo "${CATALOG_REPO}" \
            --base main \
            --head "$BRANCH" \
            --title "feat(oc-mirror): add oc-mirror-operator v${VERSION}" \
            --body "## oc-mirror-operator v${VERSION}

          This PR registers the new release in the brtrm-dev-catalog.

          ### Bundle Image (multi-arch manifest list)
          \`\`\`
          ${BUNDLE_DIGEST_REF}
          \`\`\`

          ### Component Images (multi-arch)
          \`\`\`
          Controller: ${{ env.CONTROLLER_IMAGE }}:${{ github.ref_name }}@${{ needs.build-operator.outputs.controller_digest }}
          Manager: ${{ env.MANAGER_IMAGE }}:${{ github.ref_name }}@${{ needs.build-operator.outputs.manager_digest }}
          Worker: ${{ env.WORKER_IMAGE }}:${{ github.ref_name }}@${{ needs.build-operator.outputs.worker_digest }}
          Console plugin images: ${{ env.PLUGIN_IMAGE }}:${{ github.ref_name }}-ocp4.18 through -ocp4.22 (version-specific)
          \`\`\`

          Opened automatically by the [release workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
