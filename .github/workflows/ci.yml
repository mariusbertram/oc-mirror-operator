name: CI

# Runs on every push and pull request.
# Jobs: test → build (image artifact) → e2e (reuses artifact)
# Also validates the OLM bundle (operator-sdk bundle validate), verifies
# that multi-arch and bundle image builds succeed, and runs a
# headless-browser smoke test of the console plugin against a real
# openshift/origin-console container (plugin-smoke-test).

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  # ── 1. Unit tests ──────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go mod tidy
          make test

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f cover.out ]; then
            echo "No cover.out produced (test run failed before coverage was written)."
            exit 0
          fi
          {
            echo "### Test coverage"
            echo
            echo '```'
            go tool cover -func=cover.out | awk '{printf "%-80s %-40s %s\n", $1, $2, $3}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: cover.out
          retention-days: 7
          if-no-files-found: ignore

  # ── 2. Build component images and export as artifacts ────────────────────────
  build:
    name: Build component images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload Grype SARIF to the Security tab
    steps:
      - uses: actions/checkout@v6

      # Build four separate single-arch (amd64) images tagged with the names the e2e
      # test suite expects and save them as tar archives for downstream jobs.
      - name: Build images (controller, manager, worker)
        run: |
          set -x
          CONTAINER_TOOL=docker make docker-build-controller docker-build-manager docker-build-worker \
            IMG_CONTROLLER=example.com/oc-mirror-controller:v0.0.1 \
            IMG_MANAGER=example.com/oc-mirror-manager:v0.0.1 \
            IMG_WORKER=example.com/oc-mirror-worker:v0.0.1
          
          # Verify built images exist
          echo "Built images:"
          docker images | grep "oc-mirror"

      - name: Build plugin image
        run: |
          set -x
          echo "Building plugin image..."
          CONTAINER_TOOL=docker make docker-build-plugin \
            IMG_PLUGIN=example.com/oc-mirror-plugin:v0.0.1
          
          # Verify built image exists
          echo "Plugin image:"
          docker images | grep "oc-mirror-plugin"

      # These images are only built locally for this job (never pushed to a
      # registry), so attest: false — SBOM/scan/SARIF only, no cosign step.
      # Unlike the release pipeline's scan (tag-triggered, so its SARIF only
      # lands in persistent artifacts — see the composite action's description),
      # this job runs on push/pull_request, so findings here DO show up in
      # the repo's Security tab.
      - name: SBOM + vulnerability scan (controller)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: example.com/oc-mirror-controller:v0.0.1
          artifact-name: controller-ci
          sarif-category: controller-image-ci
          attest: "false"
          fail-build: "false"
          vex-files: vex/oc-mirror-operator.openvex.json

      - name: SBOM + vulnerability scan (manager)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: example.com/oc-mirror-manager:v0.0.1
          artifact-name: manager-ci
          sarif-category: manager-image-ci
          attest: "false"
          fail-build: "false"
          vex-files: vex/oc-mirror-operator.openvex.json

      - name: SBOM + vulnerability scan (worker)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: example.com/oc-mirror-worker:v0.0.1
          artifact-name: worker-ci
          sarif-category: worker-image-ci
          attest: "false"
          fail-build: "false"
          vex-files: vex/oc-mirror-operator.openvex.json

      - name: Export images to tar
        run: |
          set -x
          echo "Exporting controller image..."
          docker save example.com/oc-mirror-controller:v0.0.1 -o operator-controller-image.tar
          echo "Exporting manager image..."
          docker save example.com/oc-mirror-manager:v0.0.1 -o operator-manager-image.tar
          echo "Exporting worker image..."
          docker save example.com/oc-mirror-worker:v0.0.1 -o operator-worker-image.tar
          echo "Exporting plugin image..."
          docker save example.com/oc-mirror-plugin:v0.0.1 -o operator-plugin-image.tar
          
          # Verify exported files exist and have content
          echo "Exported tar files:"
          ls -lh operator-*-image.tar || (echo "ERROR: Failed to export images"; exit 1)
          du -sh operator-*-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: operator-images
          path: operator-*-image.tar
          retention-days: 1

  # Scan all console profiles independently of the default plugin tar used by
  # e2e. CI scans local amd64 images; release scans both published architectures.
  scan-plugin:
    name: Scan console plugin for OpenShift ${{ matrix.console-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        console-version: ['4.18', '4.19', '4.20', '4.21', '4.22']
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build console-specific plugin image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.plugin
          platforms: linux/amd64
          load: true
          build-args: |
            CONSOLE_VERSION=${{ matrix.console-version }}
          tags: example.com/oc-mirror-plugin:v0.0.1-ocp${{ matrix.console-version }}

      - name: SBOM + vulnerability scan (plugin)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: example.com/oc-mirror-plugin:v0.0.1-ocp${{ matrix.console-version }}
          artifact-name: plugin-ci-ocp-${{ matrix.console-version }}-amd64
          sarif-category: plugin-image-ci-ocp-${{ matrix.console-version }}-amd64
          attest: "false"
          fail-build: "false"
          vex-files: vex/oc-mirror-operator.openvex.json

  # ── 3. Bundle validation + image build check ───────────────────────────────
  build-bundle-check:
    name: Build bundle image check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate and validate bundle
        run: |
          # make bundle regenerates bundle/ from config/ and runs the default
          # `operator-sdk bundle validate`; the operatorframework suite adds the
          # OperatorHub (v2), good-practices and deprecated-API checks on top.
          # NB: the suite's legacy `operatorhub` validator is deprecated in
          # favour of operatorhub/v2 + the standard capability/category checks.
          IMG_CONTROLLER=example.com/oc-mirror-controller:v0.0.1 \
          IMG_MANAGER=example.com/oc-mirror-manager:v0.0.1 \
          IMG_WORKER=example.com/oc-mirror-worker:v0.0.1 \
          IMG_PLUGIN=example.com/oc-mirror-plugin:v0.0.1 \
          USE_IMAGE_DIGESTS=false \
            make bundle
          bin/operator-sdk bundle validate ./bundle --select-optional suite=operatorframework \
            && bin/operator-sdk bundle validate ./bundle --select-optional 'name in (operatorhubv2,capabilities,categories)'

      - uses: docker/setup-buildx-action@v4

      - name: Build bundle image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bundle.Dockerfile
          platforms: linux/amd64
          push: false

  # ── 4. Multi-arch component build check ────────────────────────────────────
  build-multiarch-check:
    name: Multi-arch build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build controller image (linux/amd64 + linux/arm64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.controller
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build manager image (linux/amd64 + linux/arm64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.manager
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build worker image (linux/amd64 + linux/arm64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build plugin image (linux/amd64 + linux/arm64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.plugin
          platforms: linux/amd64,linux/arm64
          push: false

  # ── 5. E2E tests (cluster, catalog, release) ─────────────────────────────
  # Single Kind cluster; operator deployed via make deploy.
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download component images artifacts
        uses: actions/download-artifact@v8
        with:
          name: operator-images
          path: .

      - name: Install Kind v0.29.0
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kind cluster
        run: |
          # Retry up to 3 times — KinD cluster creation can fail transiently
          # on GitHub Actions runners (kubelet cgroup race, slow I/O).
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            kind delete cluster --name oc-mirror-e2e 2>/dev/null || true

            cat <<'EOF' | kind create cluster --name oc-mirror-e2e --wait 5m --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          # Pin node image for reproducibility (containerd 2.x, Kubernetes 1.33.1)
          nodes:
          - role: control-plane
            image: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
          EOF

            if [ $? -eq 0 ]; then
              echo "Cluster created successfully"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "Failed to create cluster after 3 attempts"
              exit 1
            fi
            # Exponential backoff: 10s, 30s, 60s
            backoff=$((10 * attempt))
            echo "Cluster creation failed, retrying in ${backoff}s..."
            sleep $backoff
          done

      - name: Verify cluster health
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Load component images into Kind
        run: |
          set -x
          # Verify tar files exist
          ls -lh operator-*-image.tar || (echo "ERROR: Image tar files not found"; exit 1)
          
          # Load images from tar
          echo "Loading Docker images..."
          docker load -i operator-controller-image.tar
          docker load -i operator-manager-image.tar
          docker load -i operator-worker-image.tar
          docker load -i operator-plugin-image.tar
          
          # Verify images exist in Docker
          echo "Verifying loaded images..."
          docker images | grep "oc-mirror"
          
          # Load images into Kind cluster
          echo "Loading images into Kind cluster..."
          kind load docker-image example.com/oc-mirror-controller:v0.0.1 --name oc-mirror-e2e
          kind load docker-image example.com/oc-mirror-manager:v0.0.1 --name oc-mirror-e2e
          kind load docker-image example.com/oc-mirror-worker:v0.0.1 --name oc-mirror-e2e
          kind load docker-image example.com/oc-mirror-plugin:v0.0.1 --name oc-mirror-e2e
      - name: Install cert-manager v1.16.3
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml
          kubectl wait deployment/cert-manager-webhook \
            --namespace cert-manager \
            --for=condition=Available \
            --timeout=300s

      - name: Run E2E tests (cluster, catalog, release)
        run: |
          go mod tidy
          SKIP_CLUSTER_SETUP=true \
          CERT_MANAGER_INSTALL_SKIP=true \
          KIND_CLUSTER=oc-mirror-e2e \
          go test ./test/e2e/ -v -timeout 45m \
            -ginkgo.v \
            -ginkgo.label-filter="!catalog-live"
          # label map:
          #   cluster         – needs Kind + deployed operator (mirror, catalog-cluster)
          #   catalog         – pure in-memory FBC filter tests, no cluster required
          #   release         – Cincinnati API (api.openshift.com), reachable in CI
          #   catalog-live    – quay.io/operatorhubio/catalog (~2 GB), manual only

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          echo "=== Cluster Nodes ==="
          kubectl get nodes -o wide || true
          echo "=== All Pods ==="
          kubectl get pods -A -o wide || true
          echo "=== Deployments (all namespaces) ==="
          kubectl get deployments -A -o wide || true
          echo "=== Describe Deployments in oc-mirror-system ==="
          kubectl describe deployments -n oc-mirror-system || true
          echo "=== Describe Pods in oc-mirror-system ==="
          kubectl describe pods -n oc-mirror-system || true
          echo "=== Failed/Pending Pod Events ==="
          kubectl get events -A --sort-by=.lastTimestamp | grep -E "Failed|ErrImagePull|ImagePullBackOff|Pending|Warning" | tail -50 || true
          echo "=== All Events (last 80) ==="
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          echo "=== Controller-Manager Logs (oc-mirror-system) ==="
          kubectl logs -l control-plane=controller-manager -n oc-mirror-system --tail=100 --all-containers 2>/dev/null || true
          echo "=== Images loaded in Kind nodes ==="
          for node in $(kind get nodes --name oc-mirror-e2e 2>/dev/null); do
            echo "--- Node: $node ---"
            docker exec "$node" crictl images 2>/dev/null | grep -E "oc-mirror|example.com" || true
          done

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name oc-mirror-e2e

  # ── 6. Console plugin smoke test (real console + headless browser) ────────
  # Runs the actual openshift/origin-console "bridge" container against a Kind
  # cluster, registers our freshly-built plugin with it the same way
  # openshift/console-plugin-template does for local dev (BRIDGE_PLUGINS /
  # BRIDGE_PLUGIN_PROXY, since Kind has no console-operator to reconcile a
  # ConsolePlugin CR into those flags for us), and drives a headless browser
  # to each plugin page. This is the only check in this repo that exercises
  # actual runtime rendering — it would have caught the "Minified React error
  # #130" regression, which was invisible to `npm run build:plugin` (a
  # webpack/TypeScript compile) and to the `e2e` job above (plain Kubernetes,
  # no console.openshift.io CRDs, so ConsolePluginReconciler skips itself).
  plugin-smoke-test:
    name: Console plugin light/dark smoke (OpenShift ${{ matrix.console-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        console-version: ['4.18', '4.19', '4.20', '4.21', '4.22']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build plugin UI assets and embed them into the Go binary
        env:
          CONSOLE_VERSION: ${{ matrix.console-version }}
        run: |
          set -x
          npm --prefix ui ci
          npm --prefix ui run install:console-profile
          npm --prefix ui run build:plugin
          rm -rf pkg/resourceapi/plugin
          cp -r ui/dist/plugin pkg/resourceapi/plugin
          mkdir -p .runtime-smoke
          go build -o .runtime-smoke/plugin ./cmd/dashboard

      - name: Install Kind v0.29.0
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kind cluster
        run: kind create cluster --name plugin-smoke --wait 3m

      - name: Install CRDs and seed test data
        run: |
          set -x
          make install
          kubectl create namespace oc-mirror-demo
          node hack/plugin-smoke/seed.mjs | kubectl apply -f -
          kubectl patch mirrortarget demo-target -n oc-mirror-demo --subresource=status \
            --type=merge -p "$(node hack/plugin-smoke/seed.mjs --status)"

      - name: Start plugin resource-API server (off-cluster, same binary the Dockerfile.plugin image runs)
        run: |
          set -x
          openssl req -x509 -newkey rsa:2048 -keyout .runtime-smoke/tls.key -out .runtime-smoke/tls.crt \
            -days 1 -nodes -subj "/CN=localhost"
          KUBECONFIG="$HOME/.kube/config" POD_NAMESPACE=oc-mirror-demo \
            .runtime-smoke/plugin --bind-address=:9001 --cert-file=.runtime-smoke/tls.crt --key-file=.runtime-smoke/tls.key \
            > .runtime-smoke/plugin.log 2>&1 &
          echo $! > .runtime-smoke/plugin.pid
          for i in $(seq 1 30); do
            curl -fsSk https://localhost:9001/api/v1/targets && break
            sleep 1
          done
          curl -fsSk https://localhost:9001/api/v1/targets > /dev/null

      - name: Relay the plugin's HTTPS port to plain HTTP for bridge
        # bridge's --plugins / --plugin-proxy flags dial the plugin endpoint directly
        # (no console-operator here to wire up the in-cluster Service-proxy path), so
        # this avoids getting bridge to trust our throwaway self-signed smoke-test cert.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq socat
          socat TCP-LISTEN:9002,fork,reuseaddr OPENSSL:localhost:9001,verify=0 &
          echo $! > .runtime-smoke/socat.pid
          sleep 1
          curl -fsS http://localhost:9002/plugin-manifest.json > /dev/null

      - name: Mint a bearer token for bridge's off-cluster K8s access
        id: kube
        run: |
          kubectl create serviceaccount console-viewer -n default
          kubectl create clusterrolebinding console-viewer --clusterrole=cluster-admin --serviceaccount=default:console-viewer
          token="$(kubectl create token console-viewer --duration=1h)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "api_server=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_OUTPUT"

      - name: Start OpenShift console (real console.openshift.io frontend/bridge)
        run: |
          docker run -d --name console --network host \
            -e BRIDGE_USER_AUTH=disabled \
            -e BRIDGE_USER_SETTINGS_LOCATION=localstorage \
            -e BRIDGE_K8S_MODE=off-cluster \
            -e BRIDGE_K8S_MODE_OFF_CLUSTER_ENDPOINT="${{ steps.kube.outputs.api_server }}" \
            -e BRIDGE_K8S_MODE_OFF_CLUSTER_SKIP_VERIFY_TLS=true \
            -e BRIDGE_K8S_AUTH_BEARER_TOKEN="${{ steps.kube.outputs.token }}" \
            -e BRIDGE_LISTEN=http://0.0.0.0:9000 \
            -e BRIDGE_BASE_ADDRESS=http://localhost:9000 \
            -e BRIDGE_PLUGINS=oc-mirror-operator=http://localhost:9002 \
            -e BRIDGE_PLUGIN_PROXY='{"services":[{"consoleAPIPath":"/api/proxy/plugin/oc-mirror-operator/resourceapi/","endpoint":"http://localhost:9002","authorize":false}]}' \
            quay.io/openshift/origin-console:${{ matrix.console-version }}
          for i in $(seq 1 60); do
            curl -sSf http://localhost:9000/ -o /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:9000/ > /dev/null

      - name: Run light and dark headless-browser smoke test (opposite OS preferences)
        env:
          CONSOLE_VERSION: ${{ matrix.console-version }}
          SMOKE_BEARER_TOKEN: ${{ steps.kube.outputs.token }}
        run: |
          cd hack/plugin-smoke
          npm install
          npx playwright install --with-deps chromium
          node smoke-test.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-smoke-screenshots-ocp-${{ matrix.console-version }}
          path: hack/plugin-smoke/artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Diagnostic dump on failure
        if: failure()
        run: |
          echo "=== Plugin server log ==="
          cat .runtime-smoke/plugin.log || true
          echo "=== Console container logs ==="
          docker logs console || true
          echo "=== Demo MirrorTarget/ImageSet ==="
          kubectl get mirrortarget,imageset -n oc-mirror-demo -o yaml || true

      - name: Cleanup
        if: always()
        run: |
          [ -f .runtime-smoke/plugin.pid ] && kill "$(cat .runtime-smoke/plugin.pid)" 2>/dev/null || true
          [ -f .runtime-smoke/socat.pid ] && kill "$(cat .runtime-smoke/socat.pid)" 2>/dev/null || true
          docker rm -f console 2>/dev/null || true
          kind delete cluster --name plugin-smoke 2>/dev/null || true
