apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: oc-mirror
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: oc-mirror
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: oc-mirror
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        oc-mirror-manager-image: manager:latest
        oc-mirror-worker-image: worker:latest
        oc-mirror-plugin-image-4-18: plugin-4-18:latest-ocp4.18
        oc-mirror-plugin-image-4-19: plugin-4-19:latest-ocp4.19
        oc-mirror-plugin-image-4-20: plugin-4-20:latest-ocp4.20
        oc-mirror-plugin-image-4-21: plugin-4-21:latest-ocp4.21
        oc-mirror-plugin-image-4-22: plugin-4-22:latest-ocp4.22
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: oc-mirror
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
                    - arm64
                    - ppc64le
                    - s390x
                - key: kubernetes.io/os
                  operator: In
                  values:
                    - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /controller
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        env:
        - name: OPERATOR_IMAGE
          value: controller:latest
        - name: MANAGER_IMAGE
          value: manager:latest
        - name: WORKER_IMAGE
          value: worker:latest
        - name: RELATED_IMAGE_PLUGIN_4_18
          value: plugin-4-18:latest-ocp4.18
        - name: RELATED_IMAGE_PLUGIN_4_19
          value: plugin-4-19:latest-ocp4.19
        - name: RELATED_IMAGE_PLUGIN_4_20
          value: plugin-4-20:latest-ocp4.20
        - name: RELATED_IMAGE_PLUGIN_4_21
          value: plugin-4-21:latest-ocp4.21
        - name: RELATED_IMAGE_PLUGIN_4_22
          value: plugin-4-22:latest-ocp4.22
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
