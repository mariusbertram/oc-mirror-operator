<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Source Gradient (Red) -->
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Target Gradient (Blue) -->
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Sync Gradient -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Particle Glow -->
    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bgGrad)" />

  <!-- Source Container (Left) -->
  <g transform="translate(72, 128)">
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="none" stroke="url(#sourceGrad)" stroke-width="2" />
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="url(#sourceGrad)" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="4" fill="url(#sourceGrad)" filter="url(#glow)" opacity="0.8" />
  </g>

  <!-- Target Container (Right) -->
  <g transform="translate(184, 128)">
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="none" stroke="url(#targetGrad)" stroke-width="2" />
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="none" stroke="url(#targetGrad)" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="0" r="4" fill="url(#targetGrad)" filter="url(#glow)" opacity="0.8" />
  </g>

  <!-- Sync Arrow (Animated) -->
  <g transform="translate(128, 128)">
    <path d="M -60,0 L -20,0" fill="none" stroke="url(#syncGrad)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0,40; 40,0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 20,0 L 60,0" fill="none" stroke="url(#syncGrad)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0,40; 40,0" dur="1.5s" begin="0.75s" repeatCount="indefinite" />
    </path>
    <path d="M -20,0 L 20,0" fill="none" stroke="url(#syncGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Arrow Heads -->
    <path d="M -20,-4 L -12,0 L -20,4" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 20,-4 L 12,0 L 20,4" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.75s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Particles -->
  <g fill="#FFFFFF" opacity="0.8" filter="url(#particleGlow)">
    <circle r="2">
      <animateMotion path="M 72,128 L 128,128 L 184,128" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="2">
      <animateMotion path="M 184,128 L 128,128 L 72,128" dur="3s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle r="2">
      <animateMotion path="M 72,128 L 128,128 L 184,128" dur="3s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Outer Ring (Subtle Animation) -->
  <g transform="translate(128, 128)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#syncGrad)" stroke-width="1" opacity="0.5" stroke-dasharray="141.3 56.52">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title Text -->
  <g transform="translate(128, 220)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">
    <text x="0" y="0" font-size="18" fill="#F8FAFC" letter-spacing="0">
      <tspan fill="#EF4444">oc</tspan>-mirror
    </text>
    <text x="0" y="14" font-size="9" fill="#94A3B8" letter-spacing="2">OPERATOR</text>
  </g>
</svg>
