<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Source Gradient (Red) -->
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Target Gradient (Teal) -->
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <!-- Sync Gradient (Purple) -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Sharp Glow Filter -->
    <filter id="sharpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Precision Glow -->
    <filter id="precisionGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Triangle Shape for Registries -->
    <path id="triangle" d="M 0,-16 L 14,8 L -14,8 Z" />
    
    <!-- Server Rack Shape -->
    <path id="server" d="M -12,-16 L -12,-4 L -4,-4 L -4,4 L -12,4 L -12,16 L -4,16 L -4,-16 Z M 4,-16 L 4,4 L 12,4 L 12,-4 L 4,-4 L 4,-16 Z" />
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Border -->
  <g transform="translate(128, 128)">
    <rect x="-110" y="-110" width="220" height="220" rx="8" fill="none" stroke="#374151" stroke-width="1" opacity="0.3" />
    <rect x="-100" y="-100" width="200" height="200" rx="4" fill="none" stroke="url(#syncGrad)" stroke-width="1" opacity="0.2" stroke-dasharray="5,3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Source Server (Left) -->
  <g transform="translate(72, 128)">
    <use href="#server" fill="none" stroke="url(#sourceGrad)" stroke-width="2" filter="url(#sharpGlow)" />
    <use href="#server" fill="none" stroke="url(#sourceGrad)" stroke-width="1" opacity="0.4" transform="scale(0.9)" filter="url(#sharpGlow)" />
    <use href="#triangle" fill="url(#sourceGrad)" filter="url(#precisionGlow)" opacity="0.9" transform="translate(0, -20)" />
    <circle cx="0" cy="0" r="3" fill="url(#sourceGrad)" filter="url(#sharpGlow)" opacity="0.8" />
  </g>

  <!-- Target Server (Right) -->
  <g transform="translate(184, 128)">
    <use href="#server" fill="none" stroke="url(#targetGrad)" stroke-width="2" filter="url(#sharpGlow)" />
    <use href="#server" fill="none" stroke="url(#targetGrad)" stroke-width="1" opacity="0.4" transform="scale(0.9)" filter="url(#sharpGlow)" />
    <use href="#triangle" fill="url(#targetGrad)" filter="url(#precisionGlow)" opacity="0.9" transform="translate(0, 20) scale(-1, -1)" />
    <circle cx="0" cy="0" r="3" fill="url(#targetGrad)" filter="url(#sharpGlow)" opacity="0.8" />
  </g>

  <!-- Sync Lines (Geometric Precision) -->
  <g transform="translate(128, 128)" stroke-linecap="square">
    <!-- Main Sync Line -->
    <line x1="-60" y1="0" x2="60" y2="0" fill="none" stroke="url(#syncGrad)" stroke-width="3" filter="url(#sharpGlow)">
      <animate attributeName="stroke-dasharray" values="0,120; 120,0" dur="2s" repeatCount="indefinite" />
    </line>
    
    <!-- Upper Sync Line -->
    <line x1="-60" y1="-20" x2="60" y2="-20" fill="none" stroke="url(#syncGrad)" stroke-width="2" opacity="0.6" filter="url(#sharpGlow)">
      <animate attributeName="stroke-dasharray" values="0,120; 120,0" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
    </line>
    
    <!-- Lower Sync Line -->
    <line x1="-60" y1="20" x2="60" y2="20" fill="none" stroke="url(#syncGrad)" stroke-width="2" opacity="0.6" filter="url(#sharpGlow)">
      <animate attributeName="stroke-dasharray" values="0,120; 120,0" dur="2.5s" begin="1s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Arrow Heads -->
  <g transform="translate(128, 128)" filter="url(#sharpGlow)">
    <!-- Right Arrow -->
    <path d="M 50,-6 L 60,0 L 50,6" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" />
    </path>
    
    <!-- Left Arrow -->
    <path d="M -50,-6 L -60,0 L -50,6" fill="none" stroke="#0891B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Data Particles (Precise Movement) -->
  <g filter="url(#precisionGlow)">
    <!-- Particle 1 (Red) -->
    <rect x="72" y="128" width="4" height="4" rx="1" fill="#DC2626" opacity="0.9">
      <animateMotion path="M 0,0 L 116,0" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" />
    </rect>
    
    <!-- Particle 2 (Teal) -->
    <rect x="72" y="128" width="4" height="4" rx="1" fill="#0891B2" opacity="0.9">
      <animateMotion path="M 0,0 L 116,0" dur="2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </rect>
    
    <!-- Particle 3 (Purple) -->
    <rect x="184" y="128" width="4" height="4" rx="1" fill="#7C3AED" opacity="0.9">
      <animateMotion path="M 0,0 L -116,0" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" />
    </rect>
    
    <!-- Particle 4 (Purple) -->
    <rect x="184" y="128" width="4" height="4" rx="1" fill="#7C3AED" opacity="0.9">
      <animateMotion path="M 0,0 L -116,0" dur="2s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" begin="0.5s" repeatCount="indefinite" />
    </rect>
    
    <!-- Vertical Particles -->
    <rect x="72" y="128" width="4" height="4" rx="1" fill="#DC2626" opacity="0.8">
      <animateMotion path="M 0,0 L 116,-40" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="72" y="128" width="4" height="4" rx="1" fill="#0891B2" opacity="0.8">
      <animateMotion path="M 0,0 L 116,40" dur="3s" begin="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Center Connection Node -->
  <g transform="translate(128, 128)">
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="url(#syncGrad)" stroke-width="2" filter="url(#sharpGlow)" opacity="0.8" />
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="url(#syncGrad)" filter="url(#precisionGlow)" opacity="0.9" />
  </g>

  <!-- Title Text (Geometric) -->
  <g transform="translate(128, 220)" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-weight="700">
    <text x="0" y="0" font-size="16" fill="#F9FAFB" letter-spacing="1">
      <tspan fill="#DC2626">oc</tspan><tspan fill="#F9FAFB">-</tspan><tspan fill="#0891B2">mirror</tspan>
    </text>
    <text x="0" y="14" font-size="8" fill="#6B7280" letter-spacing="2" opacity="0.8">OPERATOR</text>
  </g>
</svg>
