<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient (Soft) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1A2332" />
      <stop offset="100%" stop-color="#0A111C" />
    </radialGradient>

    <!-- Source Gradient (Warm Red to Orange) -->
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Target Gradient (Cool Blue to Teal) -->
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Sync Gradient (Purple to Pink to Blue) -->
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Wave Filter for Organic Feel -->
    <filter id="waveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="turbulence" />
      <feDisplacementMap in2="turbulence" in="blur" scale="3" xChannelSelector="R" yChannelSelector="G" />
      <feComposite in="SourceGraphic" operator="over" />
    </filter>

    <!-- Blob Shape for Registries -->
    <path id="blob" d="M 0,-12 C 6,-18 12,-18 18,-12 C 24,-6 24,6 18,12 C 12,18 6,18 0,12 C -6,18 -12,18 -18,12 C -24,6 -24,-6 -18,-12 C -12,-18 -6,-18 0,-12 Z" />
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="64" fill="url(#bgGrad)" />

  <!-- Outer Wave Ring -->
  <g transform="translate(128, 128)">
    <path d="M -90,0 C -90,-45 0,-45 0,0 C 0,45 90,45 90,0 C 90,-45 0,-45 0,0 C 0,45 -90,45 -90,0 Z" 
          fill="none" stroke="url(#syncGrad)" stroke-width="2" opacity="0.2" filter="url(#waveGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Source Blob (Left) -->
  <g transform="translate(80, 128)">
    <use href="#blob" fill="none" stroke="url(#sourceGrad)" stroke-width="2.5" filter="url(#softGlow)" opacity="0.9">
      <animate attributeName="d" 
               values="M 0,-12 C 6,-18 12,-18 18,-12 C 24,-6 24,6 18,12 C 12,18 6,18 0,12 C -6,18 -12,18 -18,12 C -24,6 -24,-6 -18,-12 C -12,-18 -6,-18 0,-12 Z;
                       M 0,-14 C 8,-20 16,-20 22,-14 C 28,-8 28,8 22,14 C 16,20 8,20 0,14 C -8,20 -16,20 -22,14 C -28,8 -28,-8 -22,-14 C -16,-20 -8,-20 0,-14 Z;
                       M 0,-12 C 6,-18 12,-18 18,-12 C 24,-6 24,6 18,12 C 12,18 6,18 0,12 C -6,18 -12,18 -18,12 C -24,6 -24,-6 -18,-12 C -12,-18 -6,-18 0,-12 Z"
               dur="4s" repeatCount="indefinite" />
    </use>
    <circle cx="0" cy="0" r="6" fill="url(#sourceGrad)" filter="url(#softGlow)" opacity="0.7" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Target Blob (Right) -->
  <g transform="translate(176, 128)">
    <use href="#blob" fill="none" stroke="url(#targetGrad)" stroke-width="2.5" filter="url(#softGlow)" opacity="0.9">
      <animate attributeName="d" 
               values="M 0,-12 C 6,-18 12,-18 18,-12 C 24,-6 24,6 18,12 C 12,18 6,18 0,12 C -6,18 -12,18 -18,12 C -24,6 -24,-6 -18,-12 C -12,-18 -6,-18 0,-12 Z;
                       M 0,-14 C 8,-20 16,-20 22,-14 C 28,-8 28,8 22,14 C 16,20 8,20 0,14 C -8,20 -16,20 -22,14 C -28,8 -28,-8 -22,-14 C -16,-20 -8,-20 0,-14 Z;
                       M 0,-12 C 6,-18 12,-18 18,-12 C 24,-6 24,6 18,12 C 12,18 6,18 0,12 C -6,18 -12,18 -18,12 C -24,6 -24,-6 -18,-12 C -12,-18 -6,-18 0,-12 Z"
               dur="4s" begin="2s" repeatCount="indefinite" />
    </use>
    <circle cx="0" cy="0" r="6" fill="url(#targetGrad)" filter="url(#softGlow)" opacity="0.7" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Flowing Sync Paths (Wave-like) -->
  <g transform="translate(128, 128)" opacity="0.8">
    <!-- Main Flow -->
    <path d="M -60,0 C -40,-20 -20,-30 0,0 C 20,30 40,20 60,0" 
          fill="none" stroke="url(#syncGrad)" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)">
      <animate attributeName="stroke-dasharray" values="0,200; 200,0" dur="3s" repeatCount="indefinite" />
    </path>
    
    <!-- Secondary Flow -->
    <path d="M -60,0 C -40,20 -20,30 0,0 C 20,-30 40,-20 60,0" 
          fill="none" stroke="url(#syncGrad)" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)" opacity="0.7">
      <animate attributeName="stroke-dasharray" values="0,200; 200,0" dur="3.5s" begin="1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Data Particles (Organic Movement) -->
  <g fill="#FFFFFF" opacity="0.9" filter="url(#softGlow)">
    <!-- Particle 1 -->
    <circle r="2.5">
      <animateMotion path="M 80,128 C 100,110 140,140 176,128" dur="4s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Particle 2 -->
    <circle r="2.5">
      <animateMotion path="M 80,128 C 100,146 140,100 176,128" dur="5s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.5;3.5;2.5" dur="5s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="5s" begin="1s" repeatCount="indefinite" />
    </circle>
    
    <!-- Particle 3 (Reverse) -->
    <circle r="2.5" fill="#F472B6">
      <animateMotion path="M 176,128 C 156,110 116,140 80,128" dur="4s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.5;3.5;2.5" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Particle 4 (Reverse) -->
    <circle r="2.5" fill="#60A5FA">
      <animateMotion path="M 176,128 C 156,146 116,100 80,128" dur="5s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.5;3.5;2.5" dur="5s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;1;0.9" dur="5s" begin="1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center Connection Point -->
  <g transform="translate(128, 128)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="url(#syncGrad)" stroke-width="2" opacity="0.6" filter="url(#softGlow)">
      <animate attributeName="r" values="8;10;8" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="4" fill="url(#syncGrad)" opacity="0.8" filter="url(#softGlow)" />
  </g>

  <!-- Title Text (Organic) -->
  <g transform="translate(128, 220)" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">
    <text x="0" y="0" font-size="18" fill="#F8FAFC" letter-spacing="1">
      <tspan fill="#F87171">oc</tspan><tspan fill="#FFFFFF">-</tspan><tspan fill="#60A5FA">mirror</tspan>
    </text>
    <text x="0" y="14" font-size="9" fill="#94A3B8" letter-spacing="2" opacity="0.8">OPERATOR</text>
  </g>
</svg>
